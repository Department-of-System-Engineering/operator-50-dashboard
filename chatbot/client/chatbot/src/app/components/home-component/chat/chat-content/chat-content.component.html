<form>
  <div class="relative mx-4">
    <input type="search" id="search" class="block w-full p-4 ps-10 text-sm text-white
    border border-gray-300 rounded-lg bg-gray-50
    focus:ring-sky-500 focus:border-sky-500
    dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500
     dark:focus:border-blue-500" placeholder="Message" required [(ngModel)]="message" name="message"/>
    <button type="submit" class="text-white absolute end-2.5 bottom-2.5 bg-blue-700
     hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300
      font-medium rounded-lg text-sm px-4 py-2 dark:bg-blue-600
       dark:hover:bg-blue-700 dark:focus:ring-blue-800" (click)="sendMessageToParentComponent()">Send</button>
  </div>
</form>
